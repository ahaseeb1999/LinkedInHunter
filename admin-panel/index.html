<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LinkedIn Hunter — Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ────── Login screen ────── -->
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="logo">LH</div>
      <h1>LinkedIn Hunter</h1>
      <p class="subtitle">Admin Panel</p>

      <form id="login-form">
        <label>
          <span>Email</span>
          <input type="email" id="login-email" required autocomplete="username" />
        </label>
        <label>
          <span>Password</span>
          <input type="password" id="login-password" required autocomplete="current-password" />
        </label>
        <button type="submit" id="login-btn">Sign in</button>
      </form>
      <div id="login-error" class="error hidden"></div>
    </div>
  </div>

  <!-- ────── Main app shell ────── -->
  <div id="app-shell" class="app-shell hidden">
    <nav class="sidebar">
      <div class="brand">
        <div class="brand-logo">LH</div>
        <span>LinkedIn Hunter</span>
      </div>
      <a href="#/dashboard" class="nav-item" data-route="dashboard">
        <span class="ico">📊</span> Dashboard
      </a>
      <a href="#/licenses" class="nav-item" data-route="licenses">
        <span class="ico">🔑</span> Licenses
      </a>
      <a href="#/activity" class="nav-item" data-route="activity">
        <span class="ico">📜</span> Activity
      </a>
      <div class="sidebar-spacer"></div>
      <div class="killswitch-panel" id="kill-switch-panel"></div>
      <div class="logout-row">
        <span id="admin-email-label" class="admin-email"></span>
        <button id="logout-btn" class="ghost-btn">Sign out</button>
      </div>
    </nav>

    <main class="content">
      <div id="route-dashboard" class="route hidden"></div>
      <div id="route-licenses" class="route hidden"></div>
      <div id="route-license-detail" class="route hidden"></div>
      <div id="route-activity" class="route hidden"></div>
    </main>
  </div>

  <!-- ────── Toast ────── -->
  <div id="toast" class="toast hidden"></div>

  <!-- ────── Modal container ────── -->
  <div id="modal-root" class="modal-root hidden">
    <div class="modal-overlay" data-close></div>
    <div class="modal-card" id="modal-card"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
