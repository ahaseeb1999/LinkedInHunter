name = "linkedin-hunter-api"
main = "src/index.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# D1 database binding — env.DB will reference this
[[d1_databases]]
binding = "DB"
database_name = "linkedin-hunter-db"
database_id = "35113743-f1e7-464b-a074-decb1fb1b20b"

# ───────────────────────────────────────────────────────────────────
# Variables that are NOT secret (config flags)
# ───────────────────────────────────────────────────────────────────
[vars]
TRIAL_DAYS = "3"
DEFAULT_SEATS = "10"
SEAT_AUTO_FREE_DAYS = "15"
TOKEN_TTL_HOURS = "24"
ACTION_TOKEN_TTL_MINUTES = "10"

# ───────────────────────────────────────────────────────────────────
# Secrets — set via:
#   wrangler secret put KEY_PEPPER
#   wrangler secret put DEVICE_PEPPER
#   wrangler secret put JWT_SECRET
#   wrangler secret put ADMIN_PEPPER
#   wrangler secret put API_HMAC_SECRET
#
# These never appear in code, never committed to git, never visible in logs.
# Each should be 32+ random characters. Generate with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
# ───────────────────────────────────────────────────────────────────
